name: Inspect Short

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Get Engine Methods
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone PrismML-Eng/llama.cpp -- --depth 1 --branch prism
          echo "=== KT FILES ==="
          find llama.cpp/examples/llama.android -name "*.kt"
          echo "=== ENGINE BRIDGE ==="
          grep -rnE "class |fun |external " llama.cpp/examples/llama.android/app/src/main/java/

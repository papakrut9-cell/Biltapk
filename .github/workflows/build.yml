name: Build Bonsai Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom UI
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.31.6"

      - name: Clone PrismML and Copy UI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone PrismML-Eng/llama.cpp -- --depth 1 --branch prism
          export CMAKE_ARGS="-DGGML_OPENMP=OFF -DLLAMA_CURL=OFF"
          BASE="llama.cpp/examples/llama.android/app/src/main"
          APP_DIR="llama.cpp/examples/llama.android/app"
          
          # Копируем build.gradle с зависимостями Room
          cp .github/workflows/app_build.gradle.kts "$APP_DIR/build.gradle.kts"
          
          # Копируем код
          cp .github/workflows/activity_main.xml "$BASE/res/layout/activity_main.xml"
          cp .github/workflows/MainActivity.kt "$BASE/java/com/example/llama/MainActivity.kt"
          cp .github/workflows/ModelDatabase.kt "$BASE/java/com/example/llama/ModelDatabase.kt"
          cp .github/workflows/MessageAdapter.kt "$BASE/java/com/example/llama/MessageAdapter.kt"
          
          # Копируем пузыри чата
          cp .github/workflows/item_message_user.xml "$BASE/res/layout/item_message_user.xml"
          cp .github/workflows/item_message_assistant.xml "$BASE/res/layout/item_message_assistant.xml"
          
          # Копируем ВСЕ фоны и фоны пузырей (ДОБАВЛЕНЫ НОВЫЕ)
          cp .github/workflows/bg_bubble_user.xml "$BASE/res/drawable/bg_bubble_user.xml"
          cp .github/workflows/bg_bubble_ai.xml "$BASE/res/drawable/bg_bubble_ai.xml"
          cp .github/workflows/bg_input.xml "$BASE/res/drawable/bg_input.xml"
          cp .github/workflows/bg_chip.xml "$BASE/res/drawable/bg_chip.xml"
          cp .github/workflows/bg_badge.xml "$BASE/res/drawable/bg_badge.xml"
          cp .github/workflows/bg_nav_selected.xml "$BASE/res/drawable/bg_nav_selected.xml"
          cp .github/workflows/bg_card.xml "$BASE/res/drawable/bg_card.xml"

      - name: Grant execute permission for gradlew
        run: chmod +x ./llama.cpp/examples/llama.android/gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./llama.cpp/examples/llama.android/local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.31.6" >> ./llama.cpp/examples/llama.android/local.properties

      - name: Build APK
        run: |
          cd llama.cpp/examples/llama.android
          ./gradlew assembleDebug -Pandroid.injected.build.abi=arm64-v8a

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bonsai-Studio-New
          path: llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk

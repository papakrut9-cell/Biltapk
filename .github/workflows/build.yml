name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Clone and Build APK
        run: |
          git clone https://github.com
          cd prism-ml-llama.cpp/examples/llama.android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bonsai-Chat-APK
          path: prism-ml-llama.cpp/examples/llama.android/app/build/outputs/apk/debug/*.apk

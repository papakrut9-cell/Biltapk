name: Build Bonsai Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Custom UI
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          cmdline-tools-version: 'latest'

      - name: Accept Android SDK Licenses
        run: |
          yes | sdkmanager --licenses > /dev/null

      - name: Install NDK and CMake
        run: |
          sdkmanager "ndk;26.1.10909125" "cmake;3.31.6"

      - name: Clone PrismML and Copy Project Config + UI
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone PrismML-Eng/llama.cpp -- --depth 1 --branch prism
          export CMAKE_ARGS="-DGGML_OPENMP=OFF -DLLAMA_CURL=OFF"
          P="llama.cpp/examples/llama.android"

          # Конфигурация проекта — наша, из этого репозитория
          cp project/settings.gradle.kts                       "$P/settings.gradle.kts"
          cp project/build.gradle.kts                          "$P/build.gradle.kts"
          cp project/gradle.properties                         "$P/gradle.properties"
          cp project/gradle/libs.versions.toml                 "$P/gradle/libs.versions.toml"
          cp project/gradle/wrapper/gradle-wrapper.properties  "$P/gradle/wrapper/gradle-wrapper.properties"
          cp project/app/src/main/AndroidManifest.xml          "$P/app/src/main/AndroidManifest.xml"

          # UI-слой — тоже наш
          BASE="$P/app/src/main"
          APP_DIR="$P/app"
          mkdir -p "$BASE/java/com/example/llama" "$BASE/res/layout" "$BASE/res/drawable" "$BASE/res/values" "$BASE/res/anim"
          cp ui-overlay/app/build.gradle.kts "$APP_DIR/build.gradle.kts"
          cp ui-overlay/app/proguard-rules.pro "$APP_DIR/proguard-rules.pro"
          cp ui-overlay/src/main/java/com/example/llama/*.kt "$BASE/java/com/example/llama/"
          cp ui-overlay/src/main/res/layout/*.xml "$BASE/res/layout/"
          cp ui-overlay/src/main/res/drawable/*.xml "$BASE/res/drawable/"
          cp ui-overlay/src/main/res/values/*.xml "$BASE/res/values/"
          cp ui-overlay/src/main/res/anim/*.xml "$BASE/res/anim/"

      - name: Apply thinking control patch (real /no_think and /think at prompt level)
        run: |
          git -C llama.cpp apply --verbose ../project/patches/ai_chat_thinking.patch

      - name: Grant execute permission for gradlew
        run: chmod +x ./llama.cpp/examples/llama.android/gradlew

      - name: Create local.properties
        run: |
          echo "sdk.dir=$ANDROID_HOME" > ./llama.cpp/examples/llama.android/local.properties
          echo "cmake.dir=$ANDROID_HOME/cmake/3.31.6" >> ./llama.cpp/examples/llama.android/local.properties

      - name: Build APK (результат пишем в gradle_exit_code.txt)
        run: |
          cd llama.cpp/examples/llama.android
          ./gradlew assembleDebug assembleRelease --stacktrace 2>&1 | tee build.log
          echo ${PIPESTATUS[0]} > gradle_exit_code.txt
        shell: bash -eo pipefail {0}

      - name: Prepare diag files
        run: |
          mkdir -p ci-diag
          cp llama.cpp/examples/llama.android/build.log ci-diag/build.log || true
          cp llama.cpp/examples/llama.android/gradle_exit_code.txt ci-diag/ || true
          CODE=$(cat llama.cpp/examples/llama.android/gradle_exit_code.txt 2>/dev/null || echo 1)
          if [ "$CODE" = "0" ]; then
            echo "BUILD OK" > ci-diag/RESULT.txt
          else
            {
              echo "=== gradle exit code: $CODE ==="
              echo "=== Ошибки из лога ==="
              grep -nE "e: |error:|FAILURE|Execution failed|Caused by|Unresolved|Failed to resolve|Could not" llama.cpp/examples/llama.android/build.log | head -80
              echo ""
              echo "=== Последние 250 строк ==="
              tail -250 llama.cpp/examples/llama.android/build.log
            } > ci-diag/RESULT.txt
          fi

      - name: Push diag to ci-logs branch
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git checkout -B ci-logs
          git add -A ci-diag
          git commit -m "CI diag: run ${{ github.run_number }} sha ${{ github.sha }}" || echo "nothing to commit"
          git push --force origin ci-logs

      - name: Fail job if gradle failed
        run: |
          CODE=$(cat llama.cpp/examples/llama.android/gradle_exit_code.txt 2>/dev/null || echo 1)
          if [ "$CODE" != "0" ]; then
            exit "$CODE"
          fi

      # Ищем файл, копируем в отдельную папку
      - name: Find and Copy APK
        run: |
          echo "Ищем файлы APK..."
          find . -name "*.apk" -type f
          mkdir -p final_apk
          find . -name "*.apk" -type f -exec cp {} final_apk/ \;
          echo "Содержимое папки final_apk:"
          ls -la final_apk/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Bonsai-Studio-New
          path: final_apk/*.apk

name: Inspect Source

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect llama.android files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo clone PrismML-Eng/llama.cpp -- --depth 1 --branch prism
          echo "=== FILES TREE ==="
          find llama.cpp/examples/llama.android -maxdepth 8 -not -path '*/.*'
          echo "=== KOTLIN CODE ==="
          find llama.cpp/examples/llama.android -name "*.kt" -exec head -n 300 {} +

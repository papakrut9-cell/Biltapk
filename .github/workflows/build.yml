- name: Clone PrismML and Copy UI
  env:
    GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  run: |
    gh repo clone PrismML-Eng/llama.cpp -- --depth 1 --branch prism
    BASE="llama.cpp/examples/llama.android/app/src/main"
    
    # Копируем код
    cp .github/workflows/activity_main.xml "$BASE/res/layout/activity_main.xml"
    cp .github/workflows/MainActivity.kt "$BASE/java/com/example/llama/MainActivity.kt"
    cp .github/workflows/ModelDatabase.kt "$BASE/java/com/example/llama/ModelDatabase.kt"
    
    # Копируем пузыри чата и фоны
    cp .github/workflows/item_message_user.xml "$BASE/res/layout/item_message_user.xml"
    cp .github/workflows/item_message_assistant.xml "$BASE/res/layout/item_message_assistant.xml"
    cp .github/workflows/bg_bubble_user.xml "$BASE/res/drawable/bg_bubble_user.xml"
    cp .github/workflows/bg_bubble_ai.xml "$BASE/res/drawable/bg_bubble_ai.xml"
